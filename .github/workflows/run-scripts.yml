name: Run two Python scripts

# Triggers: on pushes to dev branch and manual runs
on:
  workflow_dispatch: # allows manual run from Actions UI

jobs:
  run-scripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run script1.py
        run: python script1.py

      - name: Run script2.py
        run: python script2.py
